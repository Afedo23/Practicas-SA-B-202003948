worker_processes auto;
error_log /tmp/error.log warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /tmp/access.log;

  # Directorios de trabajo escribibles en /tmp: el contenedor corre con
  # readOnlyRootFilesystem: true, así que nginx no puede usar sus rutas
  # por defecto bajo /var/cache o /var/run.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"frontend"}';
    }

    # Proxy hacia el api-gateway (Service ClusterIP dentro del mismo namespace).
    # El gateway ya espera el path completo con el prefijo /api o /graphql,
    # así que no se reescribe nada acá.
    location /api/ {
      proxy_pass http://sa-platform-api-gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /graphql/ {
      proxy_pass http://sa-platform-api-gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

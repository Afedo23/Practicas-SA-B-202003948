apiVersion: v2
name: sa-platform
description: >
  Chart padre de la plataforma de solicitudes operativas (maker-checker-authorizer),
  Practica 5 - Software Avanzado (USAC/FIUSAC). Empaqueta los 4 microservicios y el
  API Gateway heredados de la Practica 4 como subcharts, e incorpora PostgreSQL
  (persistencia) y RabbitMQ (mensajeria asincrona) como dependencias.
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - microservicios
  - kubernetes
  - helm
  - software-avanzado
  - usac
maintainers:
  - name: Estudiante ECYS - Software Avanzado

dependencies:
  - name: postgresql
    version: "15.5.20"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: rabbitmq
    version: "14.6.5"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
  - name: api-gateway
    version: "1.0.0"
    repository: "file://charts/api-gateway"
  - name: auth-service
    version: "1.0.0"
    repository: "file://charts/auth-service"
  - name: solicitudes-service
    version: "1.0.0"
    repository: "file://charts/solicitudes-service"
  - name: aprobaciones-service
    version: "1.0.0"
    repository: "file://charts/aprobaciones-service"
  - name: notificaciones-service
    version: "1.0.0"
    repository: "file://charts/notificaciones-service"
  - name: cronjobs
    version: "1.0.0"
    repository: "file://charts/cronjobs"

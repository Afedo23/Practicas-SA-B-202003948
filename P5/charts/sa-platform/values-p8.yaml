# Practica 8 - overrides sobre values-aws.yaml para el despliegue GitOps.
# Namespace, ResourceQuota, LimitRange y RBAC ya NO los crea Helm: los
# crea Terraform (ver /P8/terraform). Este archivo apaga esa parte del
# chart para no duplicar/pelear por los mismos objetos.

global:
  namespace: sa-p8

resourceQuota:
  managedByHelm: false

limitRange:
  managedByHelm: false

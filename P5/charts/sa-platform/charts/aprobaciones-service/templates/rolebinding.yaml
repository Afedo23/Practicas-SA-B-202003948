apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aprobaciones-service-binding
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: aprobaciones-service-sa
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: aprobaciones-service-role
  apiGroup: rbac.authorization.k8s.io

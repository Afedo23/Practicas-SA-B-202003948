apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronjob-registro-sa
  namespace: {{ .Values.global.namespace | quote }}
---
# Rol de minimo privilegio: el cronjob-registro solo necesita escribir en la
# BD (fuera del API de Kubernetes), asi que su Role dentro del cluster no
# otorga ningun permiso sobre objetos de la API salvo leer su propio
# ConfigMap (para depuracion). Queda explicitamente prohibido usar el
# ServiceAccount "default".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronjob-registro-role
  namespace: {{ .Values.global.namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ .Release.Name }}-app-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronjob-registro-binding
  namespace: {{ .Values.global.namespace | quote }}
subjects:
  - kind: ServiceAccount
    name: cronjob-registro-sa
    namespace: {{ .Values.global.namespace | quote }}
roleRef:
  kind: Role
  name: cronjob-registro-role
  apiGroup: rbac.authorization.k8s.io

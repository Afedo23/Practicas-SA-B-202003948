apiVersion: v1
kind: ServiceAccount
metadata:
  name: cronjob-resumen-sa
  namespace: {{ .Values.global.namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cronjob-resumen-role
  namespace: {{ .Values.global.namespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["{{ .Release.Name }}-app-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cronjob-resumen-binding
  namespace: {{ .Values.global.namespace | quote }}
subjects:
  - kind: ServiceAccount
    name: cronjob-resumen-sa
    namespace: {{ .Values.global.namespace | quote }}
roleRef:
  kind: Role
  name: cronjob-resumen-role
  apiGroup: rbac.authorization.k8s.io

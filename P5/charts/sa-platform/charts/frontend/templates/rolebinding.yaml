apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-binding
  namespace: {{ .Values.global.namespace }}
subjects:
  - kind: ServiceAccount
    name: frontend-sa
    namespace: {{ .Values.global.namespace }}
roleRef:
  kind: Role
  name: frontend-role
  apiGroup: rbac.authorization.k8s.io

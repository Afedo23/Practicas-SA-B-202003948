# Practica 5 - Software Avanzado
# values.yaml BASE. No contiene credenciales reales (ver values.example.yaml).
# Los archivos values-dev.yaml / values-prod.yaml sobreescriben replicas,
# limites de recursos, tag de imagen y nivel de log por ambiente.

global:
  namespace: sa-p5
  # Numero de carne del estudiante, usado por los CronJobs. Se define en
  # values-dev.yaml / values-prod.yaml (o via --set global.estudianteCarne=...).
  estudianteCarne: ""
  logLevel: info
  database:
    hostOverride: ""   # vacio => "<release-name>-postgresql" (nombre bitnami por defecto)
    port: "5432"
  broker:
    hostOverride: ""   # vacio => "<release-name>-rabbitmq"
    port: "5672"
  smtp:
    enabled: "true"
    hostOverride: ""   # vacio => mailpit (si esta habilitado) o smtp.gmail.com
    port: "587"        # ignorado si mailpit.enabled=true (usa 1025)
  mailpit:
    enabled: false      # true en values-dev.yaml para probar correos en local

namespace: sa-p5   # usado solo fuera del template context (documentacion / helm template --show-only)

ingress:
  controller: nginx
  className: nginx
  host: sa-platform.local

resourceQuota:
  requestsCpu: "4"
  requestsMemory: "4Gi"
  limitsCpu: "8"
  limitsMemory: "8Gi"
  maxPods: "40"

limitRange:
  defaultCpu: 250m
  defaultMemory: 256Mi
  defaultRequestCpu: 100m
  defaultRequestMemory: 128Mi
  maxCpu: "1"
  maxMemory: 1Gi
  minCpu: 50m
  minMemory: 64Mi

# --- Credenciales de aplicacion (Secret compartido) ---
# NUNCA se llenan aqui con valores reales. values.yaml es la base publica
# del chart; los valores reales se pasan con -f values.example.yaml (dev
# local con datos ficticios) o con un values file privado fuera del repo
# en un pipeline real.
secrets:
  db:
    user: ""
    password: ""
  broker:
    user: ""
    password: ""
  smtp:
    user: ""   # vacio => Mailpit en dev; Gmail real solo en values.example.yaml/prod
    pass: ""
  jwtSecret: ""

# --- Dependencia: PostgreSQL (bitnami) ---
postgresql:
  enabled: true
  # Bitnami retiro casi todas sus imagenes versionadas de docker.io/bitnami
  # en 2025-2026 y las movio a docker.io/bitnamilegacy (sin actualizaciones,
  # pero sirve para esta practica). Sin este override, el pod queda en
  # ImagePullBackOff con "manifest unknown".
  image:
    repository: bitnamilegacy/postgresql
  auth:
    # DEBEN coincidir con secrets.db.user / secrets.db.password de arriba.
    username: ""
    password: ""
    postgresPassword: ""
    database: postgres
  primary:
    persistence:
      enabled: true
      size: 1Gi
    # Scripts de inicializacion: crean authdb, solicitudesdb, aprobacionesdb,
    # auditoriadb y sus tablas. Contenido identico a db-init/init.sql.
    initdb:
      scripts:
        init.sql: |
          -- Crea una base de datos independiente para cada microservicio
          CREATE DATABASE authdb;
          CREATE DATABASE solicitudesdb;
          CREATE DATABASE aprobacionesdb;
          CREATE DATABASE auditoriadb;

          \c authdb
          CREATE TABLE IF NOT EXISTS usuarios (
              id SERIAL PRIMARY KEY,
              username VARCHAR(50) UNIQUE NOT NULL,
              email VARCHAR(150) NOT NULL,
              password_hash VARCHAR(255) NOT NULL,
              rol VARCHAR(20) NOT NULL CHECK (rol IN ('maker', 'checker', 'authorizer', 'admin')),
              creado_en TIMESTAMP DEFAULT NOW()
          );
          -- Usuario admin de prueba (password: admin123, hash generado con bcrypt en el seed)
          -- IMPORTANTE: reemplaza los correos de ejemplo por direcciones reales tuyas
          -- (o de compañeros que puedan confirmar) antes de probar el envio de correo,
          -- por ejemplo con:
          --   UPDATE usuarios SET email = 'tu-correo-real@gmail.com' WHERE username = 'mgarcia';
          INSERT INTO usuarios (username, email, password_hash, rol) VALUES
              ('mgarcia', 'mgarcia@example.com', '$2b$10$C6UzMDM.H6dfI/f/IKcEeOoLGb1e3H2lU2s2N.6d1ye1z8O1z8O1a', 'maker'),
              ('jchecker', 'jchecker@example.com', '$2b$10$C6UzMDM.H6dfI/f/IKcEeOoLGb1e3H2lU2s2N.6d1ye1z8O1z8O1a', 'checker'),
              ('lauthorizer', 'lauthorizer@example.com', '$2b$10$C6UzMDM.H6dfI/f/IKcEeOoLGb1e3H2lU2s2N.6d1ye1z8O1z8O1a', 'authorizer')
          ON CONFLICT DO NOTHING;

          \c solicitudesdb
          CREATE TABLE IF NOT EXISTS solicitudes (
              id SERIAL PRIMARY KEY,
              titulo VARCHAR(150) NOT NULL,
              area_solicitante VARCHAR(80) NOT NULL,
              prioridad VARCHAR(20) NOT NULL CHECK (prioridad IN ('baja', 'media', 'alta', 'critica')),
              costo_estimado NUMERIC(12,2) NOT NULL,
              estado VARCHAR(20) NOT NULL DEFAULT 'creada' CHECK (estado IN ('creada','en_revision','aprobada','rechazada')),
              creada_por VARCHAR(50) NOT NULL,
              creada_en TIMESTAMP DEFAULT NOW()
          );

          \c aprobacionesdb
          CREATE TABLE IF NOT EXISTS aprobaciones (
              id SERIAL PRIMARY KEY,
              solicitud_id INTEGER NOT NULL,
              paso VARCHAR(20) NOT NULL CHECK (paso IN ('maker','checker','authorizer')),
              estado VARCHAR(20) NOT NULL DEFAULT 'pendiente' CHECK (estado IN ('pendiente','aprobado','rechazado')),
              usuario VARCHAR(50) NOT NULL,
              comentario VARCHAR(255),
              fecha TIMESTAMP DEFAULT NOW()
          );

          -- Codigos de confirmacion por correo, requeridos para resolver un paso de
          -- checker/authorizer (ver aprobaciones-service/app/infrastructure/email_service.py).
          -- Un codigo es de un solo uso y expira a los 10 minutos.
          CREATE TABLE IF NOT EXISTS confirmaciones_pendientes (
              id SERIAL PRIMARY KEY,
              solicitud_id INTEGER NOT NULL,
              paso VARCHAR(20) NOT NULL CHECK (paso IN ('checker','authorizer')),
              usuario VARCHAR(50) NOT NULL,
              email VARCHAR(150) NOT NULL,
              codigo VARCHAR(6) NOT NULL,
              usado BOOLEAN NOT NULL DEFAULT false,
              expira_en TIMESTAMP NOT NULL,
              creado_en TIMESTAMP DEFAULT NOW()
          );

          \c auditoriadb
          -- Cronjob 1 inserta aquí cada 2 minutos (fecha/hora GMT-6 + carné del estudiante)
          CREATE TABLE IF NOT EXISTS cronjob_ejecuciones (
              id SERIAL PRIMARY KEY,
              fecha_hora TIMESTAMPTZ NOT NULL,
              carne VARCHAR(20) NOT NULL,
              creado_en TIMESTAMP DEFAULT NOW()
          );

          -- Cronjob 2 calcula el resumen y lo publica en el broker; el consumidor
          -- (notificaciones-service) lo guarda aquí solo después de procesarlo (ack manual).
          CREATE TABLE IF NOT EXISTS resumenes_cronjob (
              id SERIAL PRIMARY KEY,
              hora_bucket TIMESTAMPTZ NOT NULL,
              cantidad_ejecuciones INTEGER NOT NULL,
              carne VARCHAR(20) NOT NULL,
              publicado_en TIMESTAMPTZ NOT NULL,
              consumido_en TIMESTAMP DEFAULT NOW(),
              UNIQUE (hora_bucket, carne)
          );

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Dependencia: RabbitMQ (bitnami) ---
rabbitmq:
  enabled: true
  # Mismo motivo que postgresql: la imagen ya no existe en docker.io/bitnami.
  image:
    repository: bitnamilegacy/rabbitmq
  auth:
    # DEBEN coincidir con secrets.broker.user / secrets.broker.password.
    username: ""
    password: ""
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi


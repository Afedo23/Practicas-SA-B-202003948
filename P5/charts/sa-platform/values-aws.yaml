# Practica 6 - Software Avanzado
# Overrides de AMBIENTE AWS/EKS. Uso:
#   helm dependency build
#   helm upgrade --install sa-platform . -n sa-p6 --create-namespace \
#     -f values.local.yaml -f values-aws.yaml
#
# Reemplaza <AWS_ACCOUNT_ID> y <REGION> (us-east-2/3/4) antes de aplicar.
# Las credenciales (secrets.db.*, secrets.broker.*, postgresql.auth.*, etc.)
# siguen viniendo de values.local.yaml, que NO se versiona - igual que en P5.

global:
  namespace: sa-p6
  logLevel: info
  mailpit:
    enabled: true
    exposeWebUI: true

# replicaCount: 1 + hpa.minReplicas: 1 en todos los microservicios: t3.medium
# permite solo 11 pods por nodo (limite de ENIs/IPs del VPC CNI, no de
# CPU/memoria), y el HPA de cada subchart traia minReplicas:2 fijo, que
# sobreescribia el replicaCount de vuelta a 2 sin importar lo que pusieramos
# aqui - por eso hay que bajar tambien el minimo del HPA, no solo replicaCount.

api-gateway:
  replicaCount: 1
  hpa:
    minReplicas: 1
    maxReplicas: 2
  image:
    repository: 318233854145.dkr.ecr.us-east-2.amazonaws.com/sa-p6/api-gateway
    tag: "latest"
  service:
    type: LoadBalancer

auth-service:
  replicaCount: 1
  hpa:
    minReplicas: 1
    maxReplicas: 2
  image:
    repository: 318233854145.dkr.ecr.us-east-2.amazonaws.com/sa-p6/auth-service
    tag: "latest"

solicitudes-service:
  replicaCount: 1
  hpa:
    minReplicas: 1
    maxReplicas: 2
  image:
    repository: 318233854145.dkr.ecr.us-east-2.amazonaws.com/sa-p6/solicitudes-service
    tag: "latest"

aprobaciones-service:
  replicaCount: 1
  hpa:
    minReplicas: 1
    maxReplicas: 2
  image:
    repository: 318233854145.dkr.ecr.us-east-2.amazonaws.com/sa-p6/aprobaciones-service
    tag: "latest"

notificaciones-service:
  replicaCount: 1
  hpa:
    minReplicas: 1
    maxReplicas: 2
  image:
    repository: 318233854145.dkr.ecr.us-east-2.amazonaws.com/sa-p6/notificaciones-service
    tag: "latest"

cronjobs:
  image:
    repository: 318233854145.dkr.ecr.us-east-2.amazonaws.com/sa-p6/cronjob-registro
    tag: "latest"
  image2:
    repository: 318233854145.dkr.ecr.us-east-2.amazonaws.com/sa-p6/cronjob-resumen

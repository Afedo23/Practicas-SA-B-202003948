apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.global.namespace | required "global.namespace es requerido" | quote }}
  labels:
    app.kubernetes.io/part-of: sa-platform
  # SIN hooks: el namespace se crea como un recurso normal del release. Helm
  # ya ordena los Namespace antes que el resto de los recursos del mismo
  # install/upgrade por defecto, asi que no hace falta un hook pre-install
  # (que ademas, con hook-delete-policy: before-hook-creation, provoca que
  # Helm borre y vuelva a crear el namespace en cada intento -> carrera con
  # el resto de los recursos mientras el namespace queda en Terminating).

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sa-platform.fullname" . }}-app-config
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    {{- include "sa-platform.labels" (dict "root" . "component" "app-config") | nindent 4 }}
data:
  {{- include "sa-platform.appConfigData" . | nindent 2 }}

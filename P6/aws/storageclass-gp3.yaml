# EKS >= 1.23 no trae una StorageClass "default" (a diferencia de un cluster
# local con minikube/k3s). El addon aws-ebs-csi-driver instala el driver, pero
# la StorageClass hay que crearla aparte. Aplicar con:
#   kubectl apply -f storageclass-gp3.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
parameters:
  type: gp3

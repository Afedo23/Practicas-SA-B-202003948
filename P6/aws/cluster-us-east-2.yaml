# Practica 6 - Software Avanzado
# Config de eksctl para crear el clúster administrado en us-east-2.
# Uso: eksctl create cluster -f cluster-us-east-2.yaml
#
# us-east-2 (Ohio) a proposito, para no usar mas cuota/recursos en us-east-1
# donde ya existe otro cluster de otra practica.

apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: sa-p6-cluster
  region: us-east-2
  version: "1.31"

# Habilita el proveedor OIDC del clúster: lo necesita el addon aws-ebs-csi-driver
# (IRSA) para poder crear/adjuntar volúmenes EBS en nombre de los pods.
iam:
  withOIDC: true

managedNodeGroups:
  - name: sa-p6-ng-1
    instanceType: t3.small 
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    labels:
      role: worker
    tags:
      practica: "SA-P6"

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver   # requerido: EKS >= 1.23 no trae StorageClass default
